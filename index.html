<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>სწავლა მხიარულად</title>
    <style>
        /* ==================== GLOBAL STYLES & BACKGROUND ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0d0e15;
            overflow-x: hidden;
            position: relative;
            color: #fff;
        }

        /* iOS Liquid Glass Background Blobs */
        .ambient-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            animation: float 12s infinite alternate ease-in-out;
            z-index: 1;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            top: -50px;
            left: -50px;
        }

        .blob-2 {
            width: 450px;
            height: 450px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            bottom: -50px;
            right: -50px;
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.15); }
        }

        /* ==================== LIQUID GLASS CARD ==================== */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(35px) saturate(190%);
            -webkit-backdrop-filter: blur(35px) saturate(190%);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 2px rgba(255, 255, 255, 0.3);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* User Greeting Bar */
        .user-bar {
            display: none;
            text-align: right;
            font-size: 0.95rem;
            color: #e2e8f0;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .user-bar span {
            color: #c084fc;
            font-weight: bold;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 1.4rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 16px 20px;
            margin: 10px 0 18px 0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        select option {
            background: #1e1b4b;
            color: #fff;
        }

        input:focus, select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #c084fc;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.4);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #c084fc, #6366f1);
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(192, 132, 252, 0.3);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(192, 132, 252, 0.5);
        }

        .toggle-link {
            margin-top: 15px;
            display: inline-block;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: underline;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ==================== QUIZ SCREEN ==================== */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .option-btn {
            padding: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: #fff;
            font-size: 1.05rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* პასუხების სტატუსები */
        .option-btn.correct {
            background: rgba(34, 197, 94, 0.4) !important;
            border-color: #22c55e !important;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.4) !important;
            border-color: #ef4444 !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        /* ==================== FINAL ANIMATED SCREEN ==================== */
        .animated-congrats {
            font-size: 1.5rem;
            line-height: 1.6;
            margin: 25px 0;
            background: linear-gradient(90deg, #f43f5e, #c084fc, #3b82f6, #f43f5e);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s infinite linear, pulse 2s infinite ease-in-out;
            font-weight: bold;
        }

        @keyframes gradientMove {
            0% { background-position: 0%; }
            100% { background-position: 100%; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* ==================== GLOBAL AUTHOR FOOTER ==================== */
        .global-author {
            position: relative;
            z-index: 10;
            margin-top: 25px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #c084fc;
            text-shadow: 0 0 12px rgba(192, 132, 252, 0.6);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <div class="glass-card">
        <!-- მომხმარებლის მისალმება -->
        <div id="user-bar" class="user-bar">
            გამარჯობა, <span id="user-name-display">მომხმარებელო</span>!
        </div>

        <h1>სწავლა მხიარულად</h1>

        <!-- 1. ავტორიზაცია / რეგისტრაცია -->
        <div id="auth-screen" class="screen active">
            <h2 id="auth-title">ავტორიზაცია</h2>
            <input type="text" id="username" placeholder="შეიყვანე შენი სახელი">
            <input type="password" id="password" placeholder="პაროლი">
            <button class="btn" onclick="handleAuth()">შესვლა</button>
            <span class="toggle-link" onclick="toggleAuthMode()" id="auth-toggle">არ გაქვს ანგარიში? დარეგისტრირდი</span>
        </div>

        <!-- 2. პარამეტრების არჩევა -->
        <div id="selection-screen" class="screen">
            <h2>აირჩიე პარამეტრები</h2>
            <label style="display:block; text-align:left; margin-bottom:5px; color:#94a3b8;">კლასი:</label>
            <select id="grade-select">
                <option value="1">I კლასი</option>
                <option value="2">II კლასი</option>
                <option value="3">III კლასი</option>
                <option value="4">IV კლასი</option>
            </select>

            <label style="display:block; text-align:left; margin-bottom:5px; color:#94a3b8;">საგანი:</label>
            <select id="subject-select">
                <option value="math">მათემატიკა</option>
                <option value="geo">ქართული</option>
            </select>

            <button class="btn" onclick="startQuiz()">ქვიზის დაწყება</button>
        </div>

        <!-- 3. ქვიზის ეკრანი -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="question-count">კითხვა 1 / 20</span>
                <span id="subject-label"></span>
            </div>
            <h2 id="question-text">კითხვის ტექსტი...</h2>
            <div class="options-grid" id="options-container"></div>
        </div>

        <!-- 4. ფინალური ეკრანი -->
        <div id="final-screen" class="screen">
            <div class="animated-congrats">
                ყოჩაღ! შენ დღევანდელი ქვიზი გაიარე, დაელოდე ხვალინდელ ქვიზს!
            </div>
            <button class="btn" onclick="restart()">თავიდან დაწყება</button>
        </div>
    </div>

    <!-- მუდმივი ავტორის წარწერა -->
    <div class="global-author">
        made by: ALEKSANDRE ABESADZE
    </div>

    <script>
        // ==================== STATE MANAGEMENT ====================
        let isRegisterMode = false;
        let currentQuestionIndex = 0;
        let activeQuestions = [];
        let loggedInUser = "";
        let isAnsweringLocked = false;

        // ==================== QUESTIONS GENERATOR (WITH LOGIC & REAL ANSWERS) ====================
        function generateQuestions() {
            const data = {};
            for (let grade = 1; grade <= 4; grade++) {
                data[grade] = { math: [], geo: [] };
                
                for (let i = 1; i <= 20; i++) {
                    // 1. მათემატიკის კითხვების გენერირება
                    let num1 = i + grade * 2;
                    let num2 = i + 1;
                    let mathQ = "", correctMathAns = 0, mathOpts = [];

                    if (grade === 1) {
                        mathQ = `რას უდრის ${num1} + ${num2}?`;
                        correctMathAns = num1 + num2;
                    } else if (grade === 2) {
                        mathQ = `რას უდრის ${num1 * 2} - ${num2}?`;
                        correctMathAns = (num1 * 2) - num2;
                    } else if (grade === 3) {
                        mathQ = `რას უდრის ${i + 1} × ${grade + 1}?`;
                        correctMathAns = (i + 1) * (grade + 1);
                    } else {
                        let mult = (i * 4);
                        mathQ = `რას უდრის ${mult} ÷ 2?`;
                        correctMathAns = mult / 2;
                    }

                    mathOpts = [
                        correctMathAns,
                        correctMathAns + 2,
                        correctMathAns - 1 < 0 ? correctMathAns + 3 : correctMathAns - 1,
                        correctMathAns + 5
                    ];
                    
                    // ვურევთ პასუხებს
                    mathOpts.sort(() => Math.random() - 0.5);

                    data[grade].math.push({
                        q: mathQ,
                        options: mathOpts.map(String),
                        correctIndex: mathOpts.indexOf(correctMathAns)
                    });

                    // 2. ქართულის კითხვების გენერირება
                    let geoQ = "", geoOpts = [], correctGeoIdx = 0;

                    if (grade === 1) {
                        const vowels = ['ა', 'ე', 'ი', 'ო', 'უ'];
                        let char = String.fromCharCode(4304 + (i % 10));
                        let isV = vowels.includes(char);
                        geoQ = `ასო '${char}' არის:`;
                        geoOpts = ["ხმოვანი", "თანხმოვანი", "რიცხვი", "სასვენი ნიშანი"];
                        correctGeoIdx = isV ? 0 : 1;
                    } else if (grade === 2) {
                        geoQ = `რომელია სწორი მრავლობითი ფორმა სიტყვისთვის "ხე" (კითხვა ${i})?`;
                        geoOpts = ["ხეები", "ხენი", "ხეებ", "ხეში"];
                        correctGeoIdx = 0;
                    } else if (grade === 3) {
                        geoQ = `რომელია მოქმედების აღმნიშვნელი სიტყვა (ზმნა)?`;
                        geoOpts = ["წერს", "კალამი", "წითელი", "მაგიდა"];
                        correctGeoIdx = 0;
                    } else {
                        geoQ = `რომელია სიტყვა "ლამაზი"-ს სინონიმი?`;
                        geoOpts = ["შვენიერი", "დიდი", "ბოროტი", "სწრაფი"];
                        correctGeoIdx = 0;
                    }

                    // ქართულისთვისაც ავურიოთ ოპციები
                    let correctWord = geoOpts[correctGeoIdx];
                    geoOpts.sort(() => Math.random() - 0.5);

                    data[grade].geo.push({
                        q: geoQ,
                        options: geoOpts,
                        correctIndex: geoOpts.indexOf(correctWord)
                    });
                }
            }
            return data;
        }

        const quizData = generateQuestions();

        // ==================== LOGIC FUNCTIONS ====================
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? 'რეგისტრაცია' : 'ავტორიზაცია';
            document.getElementById('auth-toggle').innerText = isRegisterMode ? 'უკვე გაქვს ანგარიში? შედი' : 'არ გაქვს ანგარიში? დარეგისტრირდი';
        }

        function handleAuth() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) {
                alert('გთხოვთ შეიყვანოთ სახელი და პაროლი!');
                return;
            }

            loggedInUser = user;
            document.getElementById('user-name-display').innerText = loggedInUser;
            document.getElementById('user-bar').style.display = 'block';

            showScreen('selection-screen');
        }

        function startQuiz() {
            const grade = document.getElementById('grade-select').value;
            const subject = document.getElementById('subject-select').value;

            activeQuestions = quizData[grade][subject];
            currentQuestionIndex = 0;

            document.getElementById('subject-label').innerText = subject === 'math' ? 'მათემატიკა' : 'ქართული';
            
            showScreen('quiz-screen');
            loadQuestion();
        }

        function loadQuestion() {
            isAnsweringLocked = false;

            if (currentQuestionIndex >= activeQuestions.length) {
                showScreen('final-screen');
                return;
            }

            const qData = activeQuestions[currentQuestionIndex];
            document.getElementById('question-count').innerText = `კითხვა ${currentQuestionIndex + 1} / ${activeQuestions.length}`;
            document.getElementById('question-text').innerText = qData.q;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (isAnsweringLocked) return;
            isAnsweringLocked = true;

            const qData = activeQuestions[currentQuestionIndex];
            const allButtons = document.querySelectorAll('.option-btn');

            if (selectedIndex === qData.correctIndex) {
                btnElement.classList.add('correct');
            } else {
                btnElement.classList.add('wrong');
                // აჩვენებს სწორ პასუხსაც
                allButtons[qData.correctIndex].classList.add('correct');
            }

            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 850);
        }

        function restart() {
            showScreen('selection-screen');
        }
    </script>
</body>
</html>
